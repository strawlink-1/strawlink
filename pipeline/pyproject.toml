[project]
name = "strawlink-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pystac-client",
  "odc-stac",
  "rioxarray",
  "xarray",
  "dask",
  "rasterio",
  "geopandas",
  "shapely",
  "pyproj",
  "numpy",
  "pandas",
  "pyarrow",
  "lightgbm",
  "scikit-learn",
  "ortools",
  "pydantic>=2",
  "jsonschema",
  "pyyaml",
  "requests",
  "boto3",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strawlink_pipeline", "strawlink_planner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
